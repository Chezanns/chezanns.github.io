<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chez Ann's — Espace Annie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- CONNEXION -->
<section class="login" id="login" hidden>
  <form class="login__card" id="login-form">
    <span class="script">Chez Ann's</span>
    <h1>Espace Annie</h1>
    <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="login__error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="btn btn--red">Se connecter</button>
  </form>
</section>

<!-- TABLEAU DE BORD -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="top__inner">
      <div class="top__brand"><span class="script script--light">Chez Ann's</span><span class="top__tag">Espace Annie</span></div>
      <div class="top__actions">
        <button type="button" class="link-btn" id="refresh-btn">Actualiser</button>
        <a class="link-btn" href="index.html" target="_blank" rel="noopener">Voir le site</a>
        <button type="button" class="link-btn" id="logout-btn">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="main">
    <p class="demo-banner" id="demo-banner" hidden>Mode démo : commandes fictives, rien n'est enregistré.</p>
    <div class="head">
      <div>
        <p class="head__date" id="today-label"></p>
        <h1 class="head__hello">Bonjour Annie</h1>
      </div>
      <div class="tabs" role="tablist" aria-label="Période">
        <button type="button" role="tab" data-tab="today" aria-selected="false">Aujourd'hui</button>
        <button type="button" role="tab" data-tab="week" aria-selected="true">7 prochains jours</button>
        <button type="button" role="tab" data-tab="all" aria-selected="false">Tout à venir</button>
        <button type="button" role="tab" data-tab="quotes" aria-selected="false">Devis <span class="tabs__badge" id="quote-badge" hidden></span></button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="layout">
      <section class="list" aria-labelledby="list-title">
        <div class="list__head">
          <h2 id="list-title">Retraits prévus</h2>
          <label class="toggle"><input type="checkbox" id="show-done"> Afficher les commandes récupérées</label>
        </div>
        <div id="orders"></div>
      </section>

      <aside class="prep" id="prep-panel">
        <h2>À préparer</h2>
        <p class="prep__sub" id="prep-sub"></p>
        <div id="prep-boxes"></div>
        <h3>Par mignardise <span>(estimation)</span></h3>
        <div id="prep-items"></div>
        <p class="prep__tip">Touchez « Marquer prête » quand une box est terminée : elle sort de ce total.</p>
      </aside>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
